name: tests
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install 'torch>=2.8,<2.9' 'torchvision>=0.23,<0.24' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python scripts/smoke_test.py --output "${{ runner.temp }}/rsam-smoke" --device cpu
