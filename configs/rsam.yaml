model:
  input_nc: 3
  output_nc: 3
  num_regions: 3
  base_channels: 64
  n_residual_blocks: 9
  attention_blocks:
  - 1
  - 3
  hidden_dim: 128
  image_size: 256
  rav_activation: identity
  scaled_dot_product: true
  attention_backend: sdpa
  rsam_second_relu: true
  stable_instance_norm: true
  attention_control: full
region_order:
- brain
- pelvis
- abdomen
preprocessing:
  orientation: native
  transpose_xy: true
  mr_normalization: percentile
  mr_percentiles:
  - 0.5
  - 99.5
  mr_foreground_only: true
  quantize_uint8: false
  ct_clip:
  - -1000.0
  - 2000.0
training:
  seed: 42
  epochs: 200
  decay_start_epoch: 100
  global_batch_size: 6
  slices_per_case: 10
  exclude_edge_slices: 0
  num_workers: 2
  cpu_threads: 2
  lr: 0.0001
  betas:
  - 0.5
  - 0.999
  precision: fp32
  initialization: kaiming
  horizontal_flip: true
  region_balanced_sampling: true
  replay_size: 0
  replay_scope: global
  save_every_epochs: 10
  gan_loss: logistic
  vgg_layers:
  - 1
  - 3
  - 6
  - 8
  - 11
  - 13
  - 15
  - 17
  - 20
  - 22
  - 24
  - 26
  - 29
  - 31
  - 33
  - 35
  vgg_criterion: l1
  perceptual_both_directions: false
  loss_weights:
    adversarial: 1.0
    cycle: 10.0
    identity: 5.0
    perceptual: 0.01
  vgg_slice_mode: stack
  vgg_pooling: avg
  vgg_feature_reduction: channel_sum
  vgg_target_mode: paired_spatial_unpaired_statistics
  discriminator_aggregation: patch
  paired_reconstruction_weight: 100.0
  paired_reconstruction_mode: body_plus_background
  unpaired_structure_weight: 8.647545
  unpaired_air_weight: 10.0
  paired_mse_weight: 259.539471
  paired_background_weight: 0.0
  paired_full_fov_weight: 100.0
  nce_weight: 1.0
  projection_lr_multiplier: 2.0
  ct_critic_crop_regions:
  - abdomen
